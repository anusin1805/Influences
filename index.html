<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Mandala 3D Experience</title>
<style>
  :root {
    --accent: #66fcf1;
    --bg-dark: #050e1e;
    --canva-blue: #00c4cc;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg-dark);
    color: #c9a86a;
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  /* STAGE CONTROLLER NAV */
  .stage-nav {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; background: rgba(10, 22, 40, 0.85);
    padding: 8px 16px; border-radius: 30px; border: 1px solid var(--accent);
    z-index: 1000; backdrop-filter: blur(10px);
  }
  .stage-btn {
    background: transparent; border: none; color: #fff; padding: 8px 16px;
    border-radius: 20px; cursor: pointer; font-size: 12px; transition: 0.3s;
  }
  .stage-btn.active, .stage-btn:hover {
    background: var(--accent); color: #000; font-weight: bold;
  }

  /* STAGE CONTAINER */
  #viewport {
    width: 100vw; height: 100vh; position: relative;
    perspective: 1200px; display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  /* MANDALA 3D WRAPPER */
  .mandala-3d {
    width: min(70vw, 70vh); height: min(70vw, 70vh);
    position: relative; transform-style: preserve-3d;
    transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* STATE 1: VIBRANT 3D DIAGRAM */
  .state-3d-diagram .mandala-3d {
    transform: rotateX(55deg) rotateZ(-25deg) translateZ(0px);
  }
  .state-3d-diagram .m-layer {
    box-shadow: 0 0 25px rgba(102, 252, 241, 0.3);
    filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));
  }

  /* STATE 2: CANVA EDITOR VIEW */
  .state-canva .mandala-3d {
    transform: rotateX(0deg) rotateZ(0deg) translateZ(0px) scale(0.85);
  }
  .canva-ui {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    transition: opacity 0.8s ease; border: 2px dashed var(--canva-blue);
  }
  .state-canva .canva-ui { opacity: 1; pointer-events: all; }
  .canva-handle {
    width: 10px; height: 10px; background: #fff; border: 1px solid var(--canva-blue);
    position: absolute; border-radius: 2px;
  }

  /* STATE 3: EXPLODED LAYERS & OBJECTS */
  .state-exploded .mandala-3d {
    transform: rotateX(60deg) rotateZ(-45deg) scale(0.75);
  }

  /* MANDALA LAYER BASE STYLING */
  .m-layer {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(201, 168, 106, 0.4);
    transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
    transform-style: preserve-3d; background-size: cover; background-position: center;
  }

  /* EXPLODED LAYER Z-SPACING */
  .state-exploded #l-days    { transform: translateZ(240deg) translateZ(200px); }
  .state-exploded #l-pop     { transform: translateZ(160px); }
  .state-exploded #l-planets { transform: translateZ(120px); }
  .state-exploded #l-energy  { transform: translateZ(80px); }
  .state-exploded #l-week    { transform: translateZ(40px); }
  .state-exploded #l-core    { transform: translateZ(0px); }

  /* OVERLAY HUD INFO FOR STATE 3 */
  .layer-tag {
    position: absolute; right: -120px; top: 50%; background: rgba(0,0,0,0.8);
    color: var(--accent); padding: 4px 8px; font-size: 10px; border-radius: 4px;
    border: 1px solid var(--accent); opacity: 0; transition: opacity 0.5s;
  }
  .state-exploded .layer-tag { opacity: 1; }
</style>
</head>
<body class="state-3d-diagram">

<!-- STAGE CONTROLLER BUTTONS -->
<div class="stage-nav">
  <button class="stage-btn active" onclick="switchStage('state-3d-diagram')">1. Vibrant 3D</button>
  <button class="stage-btn" onclick="switchStage('state-canva')">2. Canva Editor Mode</button>
  <button class="stage-btn" onclick="switchStage('state-exploded')">3. Exploded Objects</button>
</div>

<!-- MAIN VIEWPORT -->
<div id="viewport">
  <div class="canva-ui">
    <div class="canva-handle" style="top:-5px; left:-5px;"></div>
    <div class="canva-handle" style="top:-5px; right:-5px;"></div>
    <div class="canva-handle" style="bottom:-5px; left:-5px;"></div>
    <div class="canva-handle" style="bottom:-5px; right:-5px;"></div>
  </div>

  <div class="mandala-3d" id="mandala">
    <!-- OUTER LAYERS -->
    <div class="m-layer" id="l-days" style="border-color: #66fcf1;">
      <span class="layer-tag">Layer 9: 365 Days</span>
    </div>
    <div class="m-layer" id="l-pop" style="margin: 5%; width: 90%; height: 90%; border-color: #f1d27a;">
      <span class="layer-tag">Layer 8: Population</span>
    </div>
    <div class="m-layer" id="l-planets" style="margin: 10%; width: 80%; height: 80%;">
      <span class="layer-tag">Layer 7: Planets</span>
    </div>
    <div class="m-layer" id="l-energy" style="margin: 15%; width: 70%; height: 70%; background: radial-gradient(circle, transparent, rgba(102, 252, 241, 0.1));">
      <span class="layer-tag">Layer 6: Energy</span>
    </div>
    <div class="m-layer" id="l-week" style="margin: 20%; width: 60%; height: 60%;">
      <span class="layer-tag">Layer 5: Weekdays</span>
    </div>
    <div class="m-layer" id="l-core" style="margin: 30%; width: 40%; height: 40%; background: #0a1628; display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px;">
      CORE
      <span class="layer-tag">Layer 1: Foundation</span>
    </div>
  </div>
</div>

<script>
  function switchStage(stageClass) {
    document.body.className = stageClass;
    document.querySelectorAll('.stage-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
  }

  // Mouse Parallax for Stage 1 (3D Effect)
  const viewport = document.getElementById('viewport');
  const mandala = document.getElementById('mandala');

  viewport.addEventListener('mousemove', (e) => {
    if(!document.body.classList.contains('state-3d-diagram')) return;
    const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
    const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
    mandala.style.transform = `rotateX(${55 + yAxis}deg) rotateZ(${-25 + xAxis}deg)`;
  });
</script>
</body>
</html>
