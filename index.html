<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Mandala Alignment</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --text-main: #c5c6c7;
            --accent: #66fcf1;
            --accent-dim: #45a29e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 350px;
            background-color: var(--panel-bg);
            padding: 2rem;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
            z-index: 10;
        }
        h1 {
            color: var(--accent);
            font-size: 1.5rem;
            margin-top: 0;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        label {
            font-size: 0.9rem;
            color: var(--accent-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input, select {
            padding: 0.8rem;
            background-color: var(--bg-color);
            border: 1px solid var(--accent-dim);
            color: var(--text-main);
            border-radius: 4px;
            font-size: 1rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }
        button {
            padding: 1rem;
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 1rem;
        }
        button:hover {
            background-color: var(--accent-dim);
        }
        
        /* Main Stage & Mandala Layers CSS */
        .main-stage {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .mandala-container {
            position: relative;
            width: 85vh;
            height: 85vh;
            max-width: 900px;
            max-height: 900px;
        }
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--accent);
            z-index: 20;
            filter: drop-shadow(0 0 8px var(--accent));
        }
        
        .layer {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%;
            object-fit: contain;
            transform-origin: center center;
            /* Smooth transitions for Javascript rotation */
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        /* Ambient background rotations for nature/cosmos layers */
        .layer-3 { animation: rotate-slow 180s linear infinite; } /* Seasons */
        .layer-4 { animation: rotate-reverse 150s linear infinite; } /* Elements */
        .layer-6 { animation: rotate-slow 240s linear infinite; } /* Energy */
        .layer-7 { animation: rotate-reverse 300s linear infinite; } /* Planets */

        @keyframes rotate-slow { from {transform: rotate(0deg)} to {transform: rotate(360deg)} }
        @keyframes rotate-reverse { from {transform: rotate(360deg)} to {transform: rotate(0deg)} }

        #results-panel {
            margin-top: 1rem;
            padding: 1rem;
            background-color: rgba(0,0,0,0.3);
            border-left: 3px solid var(--accent);
            font-size: 0.9rem;
            line-height: 1.5;
            display: none;
            animation: fadeIn 1s forwards;
        }
        .result-section { margin-bottom: 1rem; }
        .result-title { color: var(--accent); font-weight: bold; margin-bottom: 0.3rem; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>Cosmic Alignment</h1>
        
        <div class="form-group">
            <label for="dob">Date of Birth (Outer Time Layer)</label>
            <input type="date" id="dob" required>
        </div>

        <div class="form-group">
            <label for="country">Region (Population Ring)</label>
            <select id="country">
                <option value="India">India (1.5B)</option>
                <option value="China">China (1.5B)</option>
                <option value="Africa">Africa (1B)</option>
                <option value="Middle East">Middle East (650M)</option>
                <option value="East/South Asia">East & South Asia (300M)</option>
                <option value="USA/Canada">USA/Canada (480M)</option>
                <option value="Europe">Europe/UK/Italy (120M+)</option>
                <option value="South America">Argentina & South America</option>
            </select>
        </div>

        <div class="form-group">
            <label for="generation">Family Role (Inner Generation Layer)</label>
            <select id="generation">
                <option value="Gen1">Gen1: Grandparent (Foundation)</option>
                <option value="Gen2">Gen2: Parent (Stewardship)</option>
                <option value="Gen3">Gen3: Child (Growth)</option>
                <option value="Gen4">Gen4: Grandchild (Future)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="core">Core (Religion & Politics)</label>
            <input type="text" id="core" placeholder="e.g., Buddhism, Secular, Crossroads" required>
        </div>

        <button onclick="calculateAlignment()">Reveal Life Blueprint</button>

        <div id="results-panel"></div>
    </div>

    <!-- MOVED THE LAYERS HERE INTO THE BODY -->
    <div class="main-stage">
        <div class="mandala-container">
            <div class="pointer"></div>
            <img src="layer1_core.png" class="layer layer-1" id="layer-core">
            <img src="layer2_generations.png" class="layer layer-2" id="layer-gen">
            <img src="layer3_seasons.png" class="layer layer-3">
            <img src="layer4_elements.png" class="layer layer-4">
            <img src="layer5_weekdays.png" class="layer layer-5" id="layer-week">
            <img src="layer6_energy.png" class="layer layer-6">
            <img src="layer7_planets.png" class="layer layer-7">
            <img src="layer8_population.png" class="layer layer-8" id="layer-pop">
            <img src="layer9_365days.png" class="layer layer-9" id="layer-days">
        </div>
    </div>

    <script>
        let currentDayRotation = 0;
        let currentPopRotation = 0;
        let currentGenRotation = 0;

        function calculateAlignment() {
            const dob = document.getElementById('dob').value;
            const country = document.getElementById('country').value;
            const generation = document.getElementById('generation').value;
            const core = document.getElementById('core').value;

            if (!dob || !core) {
                alert("Please complete the Date of Birth and Core inputs.");
                return;
            }

            // 1. Calculate Day Layer (Layer 9)
            const dateObj = new Date(dob);
            const month = dateObj.getMonth();
            const day = dateObj.getDate();
            const dayOfYear = (month * 30.4) + day;
            const targetDayRotation = (dayOfYear / 365) * 360;
            currentDayRotation += 1080 + targetDayRotation - (currentDayRotation % 360); 
            document.getElementById('layer-days').style.transform = `rotate(${currentDayRotation}deg)`;

            // 2. Calculate Population Layer (Layer 8) based on string length/hash for unique alignment
            let popOffset = country.length * 45; 
            currentPopRotation += 720 + popOffset - (currentPopRotation % 360);
            document.getElementById('layer-pop').style.transform = `rotate(${currentPopRotation}deg)`;

            // 3. Calculate Generation Layer (Layer 2)
            const genMapAngles = { "Gen1": 0, "Gen2": 90, "Gen3": 180, "Gen4": 270 };
            let genOffset = genMapAngles[generation];
            currentGenRotation += 360 + genOffset - (currentGenRotation % 360);
            document.getElementById('layer-gen').style.transform = `rotate(${currentGenRotation}deg)`;

            // Generate Reading
            generateReading(month, country, generation, core);
        }

        function generateReading(month, country, generation, core) {
            const resultsPanel = document.getElementById('results-panel');
            resultsPanel.style.display = 'none'; 
            
            let season, element, energy;
            if (month >= 2 && month <= 4) { season = "Spring (Fruits)"; element = "Breath & Atmosphere"; energy = "Positive (+)"; }
            else if (month >= 5 && month <= 7) { season = "Summer (Cotton)"; element = "Heat & Fire"; energy = "Negative (Entropy)"; }
            else if (month >= 8 && month <= 10) { season = "Autumn (Pulses)"; element = "Earth & Grounding"; energy = "Negative (Entropy)"; }
            else { season = "Winter (Wheat & Greens)"; element = "Water & Flow"; energy = "Positive (+)"; }

            const genMapText = {
                "Gen1": "Your core motivation relies on establishing foundational stability and passing down wisdom.",
                "Gen2": "Your bias is geared toward stewardship, managing resources, and protecting the inner core.",
                "Gen3": "You are driven by rapid growth, absorbing the seasonal changes to branch out.",
                "Gen4": "Your orientation is futuristic, looking outward toward the elemental and cosmic layers."
            };

            setTimeout(() => {
                resultsPanel.innerHTML = `
                    <div class="result-section">
                        <div class="result-title">Core Alignment</div>
                        Rooted in <strong>${core}</strong>. ${genMapText[generation]}
                    </div>
                    <div class="result-section">
                        <div class="result-title">Cosmic Drive</div>
                        Aligned with <strong>${season}</strong> and <strong>${element}</strong> under <strong>${energy}</strong> energy.
                    </div>
                    <div class="result-section">
                        <div class="result-title">Macro Bias</div>
                        Positioned within the <strong>${country}</strong> population ring, influenced by collective gravity constraints.
                    </div>
                `;
                resultsPanel.style.display = 'block';
            }, 500); 
        }
    </script>
</body>
</html>
