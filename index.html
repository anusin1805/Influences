<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Mandala Alignment</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --text-main: #c5c6c7;
            --accent: #66fcf1;
            --accent-dim: #45a29e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 350px;
            background-color: var(--panel-bg);
            padding: 2rem;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
            z-index: 10;
        }
        h1 {
            color: var(--accent);
            font-size: 1.5rem;
            margin-top: 0;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        label {
            font-size: 0.9rem;
            color: var(--accent-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input, select {
            padding: 0.8rem;
            background-color: var(--bg-color);
            border: 1px solid var(--accent-dim);
            color: var(--text-main);
            border-radius: 4px;
            font-size: 1rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }
        button {
            padding: 1rem;
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 1rem;
        }
        button:hover {
            background-color: var(--accent-dim);
        }
        
        .main-stage {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: var(--bg-color);
        }
        
        .mandala-container {
            position: relative;
            width: 85vh;
            height: 85vh;
            max-width: 900px;
            max-height: 900px;
            isolation: isolate; /* Crucial for iOS stacking context */
        }
        
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--accent);
            z-index: 20;
            filter: drop-shadow(0 0 8px var(--accent));
        }

        /* 
           iOS FIX: The wrapper handles rotation and mix-blend-mode.
        */
        .layer {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%;
            pointer-events: none;
            transform-origin: center center;
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
            
            /* Apple iOS transparency setup */
            -webkit-mix-blend-mode: screen;
            mix-blend-mode: screen; 
            
            /* Hardware acceleration */
            -webkit-transform: translate3d(0,0,0);
            transform: translate3d(0,0,0);
        }

        /* 
           iOS FIX: The image inside handles ONLY the filter.
        */
        .layer-img {
            width: 100%; 
            height: 100%;
            object-fit: contain;
            
            /* NOTE: If your original sketches already have a BLACK background, 
               delete the two filter lines below! */
            -webkit-filter: invert(100%) brightness(120%) contrast(120%);
            filter: invert(100%) brightness(120%) contrast(120%); 
        }

        /* Ambient background rotations for nature/cosmos layers */
        .layer-3 { animation: rotate-slow 180s linear infinite; } /* Seasons */
        .layer-4 { animation: rotate-reverse 150s linear infinite; } /* Elements */
        .layer-6 { animation: rotate-slow 240s linear infinite; } /* Energy */

        @keyframes rotate-slow { 
            from { transform: rotate(0deg) translate3d(0,0,0); } 
            to { transform: rotate(360deg) translate3d(0,0,0); } 
        }
        @keyframes rotate-reverse { 
            from { transform: rotate(360deg) translate3d(0,0,0); } 
            to { transform: rotate(0deg) translate3d(0,0,0); } 
        }

        #results-panel {
            margin-top: 1rem;
            padding: 1rem;
            background-color: rgba(0,0,0,0.3);
            border-left: 3px solid var(--accent);
            font-size: 0.9rem;
            line-height: 1.5;
            display: none;
            animation: fadeIn 1s forwards;
        }
        .result-section { margin-bottom: 1rem; }
        .result-title { color: var(--accent); font-weight: bold; margin-bottom: 0.3rem; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>Cosmic Alignment</h1>
        
        <div class="form-group">
            <label for="dob">Date of Birth (Outer Time Layer)</label>
            <input type="date" id="dob" required>
        </div>

        <div class="form-group">
            <label for="country">Region (Population Ring)</label>
            <select id="country">
                <option value="India">India (1.5B)</option>
                <option value="China">China (1.5B)</option>
                <option value="Africa">Africa (1B)</option>
                <option value="Middle East">Middle East (650M)</option>
                <option value="East/South Asia">East & South Asia (300M)</option>
                <option value="USA/Canada">USA/Canada (480M)</option>
                <option value="Europe">Europe/UK/Italy (120M+)</option>
                <option value="South America">Argentina & South America</option>
            </select>
        </div>

        <div class="form-group">
            <label for="generation">Family Role (Inner Generation Layer)</label>
            <select id="generation">
                <option value="Gen1">Gen1: Grandparent (Foundation)</option>
                <option value="Gen2">Gen2: Parent (Stewardship)</option>
                <option value="Gen3">Gen3: Child (Growth)</option>
                <option value="Gen4">Gen4: Grandchild (Future)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="core">Core (Religion & Politics)</label>
            <input type="text" id="core" placeholder="e.g., Buddhism, Secular, Crossroads" required>
        </div>

        <button onclick="calculateAlignment()">Reveal Life Blueprint</button>

        <div id="results-panel"></div>
    </div>

    <!-- Main Stage restructured to fix iOS bugs -->
    <div class="main-stage">
        <div class="mandala-container">
            <div class="pointer"></div>

            <!-- Layer 1 -->
            <div class="layer layer-1" id="layer-core">
                <img src="IMG_7914.jpeg" class="layer-img" alt="Core Layer">
            </div>
            
            <!-- Layer 2 -->
            <div class="layer layer-2" id="layer-gen">
                <img src="IMG_7915.jpeg" class="layer-img" alt="Generations Layer">
            </div>
            
            <!-- Layer 3 -->
            <div class="layer layer-3">
                <img src="IMG_7916.jpeg" class="layer-img" alt="Seasons Layer">
            </div>
            
            <!-- Layer 4 -->
            <div class="layer layer-4">
                <img src="IMG_7924.jpeg" class="layer-img" alt="Elements Layer">
            </div>
            
            <!-- Layer 5 -->
            <div class="layer layer-5" id="layer-week">
                <img src="IMG_7923.jpeg" class="layer-img" alt="Weekdays Layer">
            </div>
            
            <!-- Layer 6 -->
            <div class="layer layer-6">
                <img src="IMG_7924.jpeg" class="layer-img" alt="Energy Layer">
            </div>
            
            <!-- Layer 7 -->
            <div class="layer layer-7" id="layer-planets">
                <img src="IMG_7925.jpeg" class="layer-img" alt="Planets Layer">
            </div>
            
            <!-- Layer 8 -->
            <div class="layer layer-8" id="layer-pop">
                <img src="IMG_7926.jpeg" class="layer-img" alt="Population Layer">
            </div>
            
            <!-- Layer 9 -->
            <div class="layer layer-9" id="layer-days">
                <img src="IMG_7927.jpeg" class="layer-img" alt="365 Days Layer">
            </div>
        </div>
    </div>
    
    <script>
        let currentDayRotation = 0;
        let currentPopRotation = 0;
        let currentGenRotation = 0;
        let currentPlanetRotation = 0;

        function calculateAlignment() {
            const dob = document.getElementById('dob').value;
            const country = document.getElementById('country').value;
            const generation = document.getElementById('generation').value;
            const core = document.getElementById('core').value;

            if (!dob || !core) {
                alert("Please complete the Date of Birth and Core inputs.");
                return;
            }

            // Calculate Day Layer (Layer 9)
            const dateObj = new Date(dob + "T00:00:00");
            const startOfYear = new Date(dateObj.getFullYear(), 0, 1);
            const dayOfYear = Math.floor((dateObj - startOfYear) / (1000 * 60 * 60 * 24)) + 1;
            const targetDayRotation = ((dayOfYear - 1) / 365) * 360;
            currentDayRotation += 1080 + targetDayRotation - (currentDayRotation % 360);
            
            // Added translate3d(0,0,0) here to maintain iOS GPU acceleration during spin
            document.getElementById('layer-days').style.transform = `rotate(${currentDayRotation}deg) translate3d(0,0,0)`;

            // Calculate Population Layer (Layer 8)
            let popOffset = country.length * 45; 
            currentPopRotation += 720 + popOffset - (currentPopRotation % 360);
            document.getElementById('layer-pop').style.transform = `rotate(${currentPopRotation}deg) translate3d(0,0,0)`;

            // Calculate Generation Layer (Layer 2)
            const genMapAngles = { "Gen1": 0, "Gen2": 90, "Gen3": 180, "Gen4": 270 };
            let genOffset = genMapAngles[generation];
            currentGenRotation += 360 + genOffset - (currentGenRotation % 360);
            document.getElementById('layer-gen').style.transform = `rotate(${currentGenRotation}deg) translate3d(0,0,0)`;

            // Calculate Planet Dominance (Layer 7) via Numerology
            const dobString = dob.replace(/-/g, ''); 
            let lifePath = 0;
            for (let i = 0; i < dobString.length; i++) {
                lifePath += parseInt(dobString[i]);
            }
            while (lifePath > 9) {
                let temp = 0;
                let lpStr = lifePath.toString();
                for (let i = 0; i < lpStr.length; i++) {
                    temp += parseInt(lpStr[i]);
                }
                lifePath = temp;
            }

            const planetData = {
                1: { name: "Sun", angle: 80 },        
                2: { name: "Moon", angle: 200 },      
                3: { name: "Jupiter", angle: 160 },   
                4: { name: "Uranus", angle: 120 },    
                5: { name: "Mercury", angle: 280 },   
                6: { name: "Venus", angle: 240 },     
                7: { name: "Earth", angle: 320 },     
                8: { name: "Saturn", angle: 0 },      
                9: { name: "Mars", angle: 40 }        
            };

            const dominantPlanet = planetData[lifePath];
            currentPlanetRotation += 720 + dominantPlanet.angle - (currentPlanetRotation % 360);
            document.getElementById('layer-planets').style.transform = `rotate(${currentPlanetRotation}deg) translate3d(0,0,0)`;

            const month = dateObj.getMonth();
            generateReading(month, country, generation, core, dominantPlanet.name);
        }

        function generateReading(month, country, generation, core, planetName) {
            const resultsPanel = document.getElementById('results-panel');
            resultsPanel.style.display = 'none'; 
            
            let season, element, energy;
            if (month >= 2 && month <= 4) { season = "Spring (Fruits)"; element = "Breath & Atmosphere"; energy = "Positive (+)"; }
            else if (month >= 5 && month <= 7) { season = "Summer (Cotton)"; element = "Heat & Fire"; energy = "Negative (Entropy)"; }
            else if (month >= 8 && month <= 10) { season = "Autumn (Pulses)"; element = "Earth & Grounding"; energy = "Negative (Entropy)"; }
            else { season = "Winter (Wheat & Greens)"; element = "Water & Flow"; energy = "Positive (+)"; }

            const genMapText = {
                "Gen1": "Your core motivation relies on establishing foundational stability and passing down wisdom.",
                "Gen2": "Your bias is geared toward stewardship, managing resources, and protecting the inner core.",
                "Gen3": "You are driven by rapid growth, absorbing the seasonal changes to branch out.",
                "Gen4": "Your orientation is futuristic, looking outward toward the elemental and cosmic layers."
            };

            setTimeout(() => {
                resultsPanel.innerHTML = `
                    <div class="result-section">
                        <div class="result-title">Core Alignment</div>
                        Rooted in <strong>${core}</strong>. ${genMapText[generation]}
                    </div>
                    <div class="result-section">
                        <div class="result-title">Cosmic Drive</div>
                        Aligned with <strong>${season}</strong> and <strong>${element}</strong> under <strong>${energy}</strong> energy.
                    </div>
                    <div class="result-section">
                        <div class="result-title">Celestial Dominance</div>
                        Your birth date vibrations align with <strong>${planetName}</strong>, guiding your overarching macro influence.
                    </div>
                    <div class="result-section">
                        <div class="result-title">Macro Bias</div>
                        Positioned within the <strong>${country}</strong> population ring, influenced by collective gravity constraints.
                    </div>
                `;
                resultsPanel.style.display = 'block';
            }, 500); 
        }
    </script>
</body>
</html>
